<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <style>
      .txt-black { fill: #000000; font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; }
      .txt-sub { fill: #000000; font-family: 'Arial', sans-serif; font-weight: bold; letter-spacing: 6px; }
      .line-accent { stroke: #F2C230; stroke-width: 8; stroke-linecap: round; }
      .burger-bun { fill: #C6935A; stroke: #000000; stroke-width: 6; stroke-linejoin: round; }
      .burger-meat { fill: #845432; stroke: #000000; stroke-width: 6; stroke-linejoin: round; }
      .burger-cheese { fill: #F6D155; }
      .burger-lettuce { fill: #20A052; stroke: #000000; stroke-width: 5; stroke-linejoin: round; }
    </style>
  </defs>

  <g transform="translate(10, 10)">
    <text x="20" y="170" font-size="165" class="txt-black">EL CUARTEL</text>
    <text x="895" y="170" font-size="165" class="txt-black">L</text>
  </g>

  <g id="burger-icon" transform="translate(760, 32) scale(1.15)">
    <path d="M15,50 C15,15 95,15 95,50 Z" class="burger-bun" />
    <path d="M15,50 L95,50" stroke="#000000" stroke-width="6" />
    <path d="M12,48 L98,48 L90,58 L55,58 L48,66 L40,58 L18,58 Z" class="burger-cheese" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <rect x="14" y="58" width="82" height="14" rx="7" class="burger-meat" />
    <rect x="10" y="72" width="90" height="10" rx="4" class="burger-lettuce" />
    <polygon points="42,82 58,82 50,96" class="burger-lettuce" />
    <rect x="14" y="86" width="82" height="14" rx="7" class="burger-meat" />
    <path d="M15,100 C15,122 95,122 95,100 Z" class="burger-bun" />
    <rect x="15" y="100" width="80" height="6" class="burger-bun" stroke="none" />
    <line x1="15" y1="100" x2="95" y2="100" stroke="#000000" stroke-width="6" />
  </g>

  <g id="footer" transform="translate(0, 40)">
    <line x1="45" y1="225" x2="230" y2="225" class="line-accent" />
    <text x="255" y="240" font-size="46" class="txt-sub">DELIVERY - 2018</text>
    <line x1="745" y1="225" x2="955" y2="225" class="line-accent" />
  </g>
</svg>